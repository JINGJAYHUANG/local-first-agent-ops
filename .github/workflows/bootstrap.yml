name: Diagnose public v0.1.0 transport

on:
  push:
    branches:
      - feat/public-v0.1.0
    paths:
      - .bootstrap/bootstrap.py
      - .bootstrap/chunks/**
      - .github/workflows/bootstrap.yml

permissions:
  contents: read

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out transport branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/public-v0.1.0
          fetch-depth: 1
          persist-credentials: false

      - name: Compare embedded and chunked payloads
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import difflib
          import importlib.util
          from pathlib import Path

          script = Path('.bootstrap/bootstrap.py')
          spec = importlib.util.spec_from_file_location('bootstrap_payload', script)
          if spec is None or spec.loader is None:
              raise SystemExit('cannot load bootstrap metadata')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          embedded = ''.join(module.PAYLOAD.split()).rstrip('=')
          chunked = ''.join(
              path.read_text(encoding='ascii')
              for path in sorted(Path('.bootstrap/chunks').glob('*.b64'))
          )
          chunked = ''.join(chunked.split()).rstrip('=')
          prefix = 0
          for left, right in zip(embedded, chunked):
              if left != right:
                  break
              prefix += 1
          suffix = 0
          for left, right in zip(reversed(embedded), reversed(chunked)):
              if left != right:
                  break
              suffix += 1
          print(f'archive_sha256={module.ARCHIVE_SHA256}')
          print(f'embedded_length={len(embedded)} mod4={len(embedded) % 4}')
          print(f'chunked_length={len(chunked)} mod4={len(chunked) % 4}')
          print(f'common_prefix={prefix} common_suffix={suffix}')
          matcher = difflib.SequenceMatcher(None, embedded, chunked, autojunk=False)
          opcodes = matcher.get_opcodes()
          print(f'opcode_count={len(opcodes)} ratio={matcher.ratio():.12f}')
          for opcode in opcodes:
              tag, i1, i2, j1, j2 = opcode
              if tag != 'equal':
                  print(
                      f'{tag} embedded[{i1}:{i2}]={embedded[i1:i2]!r} '
                      f'chunked[{j1}:{j2}]={chunked[j1:j2]!r}'
                  )
          raise SystemExit('diagnostic complete')
          PY
